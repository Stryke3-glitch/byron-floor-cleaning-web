<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Byron Floor Cleaning — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  a{color:inherit}

  @media (max-width:980px){
    .byron-services-grid{grid-template-columns:1fr 1fr !important}
    .byron-services-grid > *{grid-column:span 1 !important;grid-row:auto !important;min-height:0 !important}
    .byron-services-grid > *:first-child{grid-column:span 2 !important}
  }
  @media (max-width:560px){
    .byron-services-grid{grid-template-columns:1fr !important}
    .byron-services-grid > *:first-child{grid-column:span 1 !important}
  }
  @media (max-width:880px){
    .byron-nav{display:none !important}
    .byron-mtoggle{display:inline-flex !important}
    .byron-hero-grid{grid-template-columns:1fr !important;gap:40px !important}
    .byron-ba-grid{grid-template-columns:1fr !important}
    .byron-est-grid{grid-template-columns:1fr !important}
    .byron-footer-grid{grid-template-columns:1fr !important;gap:32px !important}
    .byron-form-grid{grid-template-columns:1fr !important}
  }
  @media (max-width:720px){
    .byron-stickybar{display:flex !important}
  }
  /* spacing for sticky bar so footer isn't covered */
  @media (max-width:720px){
    body{padding-bottom:80px}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="prototype-app.jsx"></script>
</body>
</html>
