<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="tile" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="skewX(-20)">
      <rect width="120" height="120" fill="hsl(32 14% 78%)"/>
      <path d="M0 0H120M0 120H120M0 0V120M120 0V120" stroke="hsl(32 12% 60%)" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="shine" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#tile)"/>
  <rect width="800" height="1000" fill="url(#shine)"/>
  <rect width="800" height="1000" fill="url(#vignette)"/>
  <ellipse cx="400" cy="280" rx="500" ry="60" fill="#fff" opacity="0.22"/>
</svg>
